{% extends "webadmin/base.html" %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<div class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="w-full px-6 lg:px-8 py-4">
        <div class="breadcrumb"><span>Settings</span></div>
        <h1 class="page-title">App Settings</h1>
    </div>
</div>

<div class="w-full px-6 lg:px-8 py-6">
    <div class="card p-6 max-w-2xl">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for row in rows %}
            <div>
                <label>{{ row.key }}</label>
                <input type="text" name="{{ row.key }}" value="{{ row.value|default:'' }}">
            </div>
            {% endfor %}
            <div class="flex gap-2 pt-2">
                <button type="submit" class="btn-primary">Save Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
