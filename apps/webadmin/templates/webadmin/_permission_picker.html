<div class="border-t border-slate-100 pt-4">
    <div class="flex items-start justify-between gap-4 mb-3">
        <div>
            <label>Permissions <span class="text-slate-400 font-normal">(optional)</span></label>
            <p class="text-xs text-slate-400">
                Leave everything unticked and this account simply follows its role.
                Tick anything and that exact set is used instead.
                <span class="inline-block px-1.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-100">•</span>
                marks what the role grants on its own.
            </p>
        </div>
        <div class="flex gap-2 flex-shrink-0">
            <button type="button" id="perm-use-defaults" class="btn-secondary text-xs px-3 py-1.5">Use role defaults</button>
            <button type="button" id="perm-clear" class="btn-secondary text-xs px-3 py-1.5">Clear all</button>
        </div>
    </div>

    <div id="permission-picker" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        {% for group in permission_groups %}
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
            <p class="text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">{{ group.label }}</p>
            <div class="space-y-1.5">
                {% for perm in group.items %}
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                    <input type="checkbox" name="permissions" value="{{ perm.slug }}"
                           data-default="{% if perm.is_default %}1{% else %}0{% endif %}"
                           {% if perm.checked %}checked{% endif %}
                           style="width:auto">
                    <span>{{ perm.name }}</span>
                    {% if perm.is_default %}
                    <span class="text-emerald-600" title="Granted by this role">•</span>
                    {% endif %}
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script>
(function () {
    var picker = document.getElementById('permission-picker');
    if (!picker) return;
    var boxes = picker.querySelectorAll('input[name="permissions"]');

    // "Use role defaults" clears the selection entirely rather than ticking
    // the defaults -- an empty POST is what tells the server to follow the
    // role, so the account keeps tracking the role if it ever changes.
    document.getElementById('perm-use-defaults').addEventListener('click', function () {
        boxes.forEach(function (b) { b.checked = false; });
    });
    document.getElementById('perm-clear').addEventListener('click', function () {
        boxes.forEach(function (b) { b.checked = false; });
    });
})();
</script>
