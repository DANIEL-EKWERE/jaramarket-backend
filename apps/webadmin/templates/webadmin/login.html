<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Jara Market Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1f2430; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 380px; width: 100%; }
        .brand { color: #FFAA00; font-weight: 700; }
        .btn-brand { background: #FFAA00; border-color: #FFAA00; color: #1f2430; font-weight: 600; }
        .btn-brand:hover { background: #e69900; border-color: #e69900; color: #1f2430; }
    </style>
</head>
<body>
    <div class="card login-card shadow p-4">
        <div class="text-center mb-4">
            <div class="brand fs-3">Jara Market</div>
            <div class="text-secondary">Admin Dashboard</div>
        </div>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-brand w-100">Log in</button>
        </form>
    </div>
</body>
</html>
