{% extends "webadmin/base.html" %}
{% block page_title %}Edit User{% endblock %}
{% block content %}
<div class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="w-full px-6 lg:px-8 py-4 flex items-center justify-between">
        <div>
            <div class="breadcrumb"><a href="{% url 'webadmin:users_list' %}" class="hover:text-emerald-600">Users</a><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg><span class="text-slate-600 font-medium">Edit</span></div>
            <h1 class="page-title">Edit User</h1>
        </div>
        <a href="{% url 'webadmin:users_list' %}" class="btn-secondary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back
        </a>
    </div>
</div>

<div class="w-full px-6 lg:px-8 py-6">
    <div class="card p-6 max-w-lg">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div><label>First name</label><input type="text" name="firstname" value="{{ target_user.firstname }}"></div>
            <div><label>Last name</label><input type="text" name="lastname" value="{{ target_user.lastname }}"></div>
            <div><label>Email</label><input type="email" name="email" value="{{ target_user.email }}"></div>
            <div>
                <label>Role</label>
                <select name="role">
                    {% for value, label in roles %}
                    <option value="{{ value }}" {% if target_user.role == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" class="btn-primary">Save</button>
                <a href="{% url 'webadmin:users_list' %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
